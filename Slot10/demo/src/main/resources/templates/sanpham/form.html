<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Thêm sản phẩm</title>
    <!-- Bootstrap CSS (offline hoặc CDN) -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="container py-4" style="max-width: 600px">
    <h2 class="h4 mb-3">Thêm sản phẩm mới</h2>

    <!--
        1. th:action: Đường dẫn submit form (tự động gắn Context Path)
        2. th:object: Gắn kết Form với đối tượng model "sanPham"
    -->
    <form th:action="@{/sanpham/them}" th:object="${sanPham}" method="post"
          class="card card-body shadow-sm">

        <!-- Ô 1: Tên sản phẩm -->
        <div class="mb-3">
            <label for="ten" class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="ten" th:field="*{ten}"
                   placeholder="Nhập tên sản phẩm..." required/>
        </div>

        <!-- Ô 2: Giá sản phẩm -->
        <div class="mb-3">
            <label for="gia" class="form-label">Giá (VNĐ)</label>
            <input type="number" class="form-control" id="gia" th:field="*{gia}" min="0" step="1000" required/>
        </div>

        <!-- Ô 3: Số lượng -->
        <div class="mb-3">
            <label for="soLuong" class="form-label">Số lượng</label>
            <input type="number" class="form-control" id="soLuong" th:field="*{soLuong}" min="0" required/>
        </div>

        <!-- Nút submit và điều hướng -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Thêm</button>
            <a th:href="@{/sanpham/ket-qua}" class="btn btn-outline-secondary">Xem danh sách</a>
        </div>
    </form>
</main>
</body>
</html>
