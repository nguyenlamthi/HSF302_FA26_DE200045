<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Thanh tìm kiếm (giữ lại sortField và sortDir) -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/students}" method="get" class="d-flex gap-2">
                <input type="hidden" name="size" th:value="${pageSize}"/>
                <input type="hidden" name="sortField" th:value="${sortField}"/>
                <input type="hidden" name="sortDir" th:value="${sortDir}"/>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" name="keyword" th:value="${keyword}"
                           class="form-control"
                           placeholder="Tìm kiếm theo tên hoặc email..."/>
                    <button type="submit" class="btn btn-primary">Tìm</button>
                    <a th:if="${keyword != null and !keyword.isBlank()}"
                       th:href="@{/students(size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                       class="btn btn-outline-secondary" title="Xóa bộ lọc">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp không có dữ liệu -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-search display-4"></i>
                <p class="mt-2" th:if="${keyword != null and !keyword.isBlank()}">
                    Không tìm thấy sinh viên nào khớp với từ khóa: "<strong th:text="${keyword}"></strong>"
                </p>
                <p class="mt-2" th:unless="${keyword != null and !keyword.isBlank()}">
                    Chưa có sinh viên nào.
                </p>
                <a th:if="${keyword != null and !keyword.isBlank()}"
                   th:href="@{/students(size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                   class="btn btn-sm btn-outline-primary">
                    Xem tất cả sinh viên
                </a>
                <a th:unless="${keyword != null and !keyword.isBlank()}" th:href="@{/students/create}" class="btn btn-outline-primary">
                    Thêm ngay
                </a>
            </div>

            <!-- Bảng hiển thị dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>

                    <!-- 1. Cột ID (bấm để sắp xếp) -->
                    <th>
                        <a th:href="@{/students(page=0, size=${pageSize}, keyword=${keyword}, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}"
                           class="text-white text-decoration-none">
                            ID
                            <i th:if="${sortField == 'id'}"
                               th:classappend="${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down'" class="bi ms-1"></i>
                        </a>
                    </th>

                    <!-- 2. Cột Họ tên (bấm để sắp xếp) -->
                    <th>
                        <a th:href="@{/students(page=0, size=${pageSize}, keyword=${keyword}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}"
                           class="text-white text-decoration-none">
                            Họ tên
                            <i th:if="${sortField == 'name'}"
                               th:classappend="${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down'" class="bi ms-1"></i>
                        </a>
                    </th>

                    <!-- 3. Cột Email -->
                    <th>
                        <a th:href="@{/students(page=0, size=${pageSize}, keyword=${keyword}, sortField='email', sortDir=${sortField == 'email' ? reverseSortDir : 'asc'})}"
                           class="text-white text-decoration-none">
                            Email
                            <i th:if="${sortField == 'email'}"
                               th:classappend="${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down'" class="bi ms-1"></i>
                        </a>
                    </th>

                    <!-- 4. Cột Tuổi (bấm để sắp xếp) -->
                    <th>
                        <a th:href="@{/students(page=0, size=${pageSize}, keyword=${keyword}, sortField='age', sortDir=${sortField == 'age' ? reverseSortDir : 'asc'})}"
                           class="text-white text-decoration-none">
                            Tuổi
                            <i th:if="${sortField == 'age'}"
                               th:classappend="${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down'" class="bi ms-1"></i>
                        </a>
                    </th>

                    <th>Chuyên ngành</th>

                    <!-- 5. Cột GPA (bấm để sắp xếp) -->
                    <th>
                        <a th:href="@{/students(page=0, size=${pageSize}, keyword=${keyword}, sortField='gpa', sortDir=${sortField == 'gpa' ? reverseSortDir : 'asc'})}"
                           class="text-white text-decoration-none">
                            GPA
                            <i th:if="${sortField == 'gpa'}"
                               th:classappend="${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down'" class="bi ms-1"></i>
                        </a>
                    </th>

                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${stat.count + (currentPage * pageSize)}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Thanh phân trang (giữ lại cả sortField và sortDir khi chuyển trang) -->
        <div th:if="${studentPage.totalPages > 1}" class="card-footer bg-white d-flex justify-content-between align-items-center py-2">
            <div>
                <small class="text-muted">
                    Trang <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${studentPage.totalPages}">1</strong>
                    (Tổng số: <strong th:text="${studentPage.totalElements}">0</strong> sinh viên)
                </small>
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <!-- Nút Trước -->
                    <li class="page-item" th:classappend="${!studentPage.hasPrevious()} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/students(page=${currentPage - 1}, size=${pageSize}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">
                            &laquo; Trước
                        </a>
                    </li>

                    <!-- Các nút số trang -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, studentPage.totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/students(page=${i}, size=${pageSize}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <!-- Nút Sau -->
                    <li class="page-item" th:classappend="${!studentPage.hasNext()} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/students(page=${currentPage + 1}, size=${pageSize}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">
                            Sau &raquo;
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</section>
</body>
</html>
