<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <!-- 15.1: Tiêu đề trang động -->
    <title th:text="${student.id == null} ? 'Thêm sinh viên' : 'Cập nhật sinh viên'">Form sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <!-- 15.2: Tiêu đề thẻ Card động -->
                    <h4 class="mb-0 fs-5"
                        th:text="${student.id == null} ? 'Thêm sinh viên mới' : 'Cập nhật sinh viên: ' + ${student.studentCode}">
                        Thêm sinh viên mới
                    </h4>
                </div>
                <div class="card-body p-4">

                    <!-- 15.3: Form liên kết đối tượng student -->
                    <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>

                        <!-- 15.4: Input ẩn giữ id khi cập nhật -->
                        <input type="hidden" th:field="*{id}">

                        <!-- 16.1: Khối thông báo tổng hợp lỗi đầu trang -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                            <strong><i class="bi bi-exclamation-triangle-fill"></i> Vui lòng sửa các lỗi sau:</strong>
                            <ul class="mb-0 mt-2">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Thông tin không hợp lệ</li>
                            </ul>
                        </div>

                        <div class="row g-3">
                            <!-- Mã sinh viên -->
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label fw-semibold">Mã sinh viên <span class="text-danger">*</span></label>
                                <input type="text" id="studentCode" class="form-control" placeholder="VD: SE180001"
                                       th:field="*{studentCode}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}"
                                     th:errors="*{studentCode}">Mã SV không hợp lệ</div>
                            </div>

                            <!-- Họ và tên -->
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-semibold">Họ tên <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" class="form-control" placeholder="Nhập họ và tên"
                                       th:field="*{fullName}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}">Họ tên không hợp lệ</div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                <input type="email" id="email" class="form-control" placeholder="VD: example@fpt.edu.vn"
                                       th:field="*{email}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">Email không đúng định dạng</div>
                            </div>

                            <!-- Ngày sinh -->
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label fw-semibold">Ngày sinh <span class="text-danger">*</span></label>
                                <input type="date" id="dateOfBirth" class="form-control"
                                       th:field="*{dateOfBirth}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}"
                                     th:errors="*{dateOfBirth}">Ngày sinh không hợp lệ</div>
                            </div>

                            <!-- GPA -->
                            <div class="col-md-6">
                                <label for="gpa" class="form-label fw-semibold">Điểm GPA (0.0 - 10.0) <span class="text-danger">*</span></label>
                                <input type="text" id="gpa" class="form-control" placeholder="VD: 8.5"
                                       th:field="*{gpa}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('gpa')}"
                                     th:errors="*{gpa}">GPA phải từ 0 đến 10</div>
                            </div>

                            <!-- Chuyên ngành -->
                            <div class="col-md-6">
                                <label for="major" class="form-label fw-semibold">Chuyên ngành <span class="text-danger">*</span></label>
                                <!-- 15.6: Lặp danh sách ngành từ Model -->
                                <select id="major" class="form-select" th:field="*{major}" th:errorclass="is-invalid">
                                    <option value="">-- Chọn ngành --</option>
                                    <option th:each="m : ${majors}"
                                            th:value="${m.key}"
                                            th:text="|${m.key} - ${m.value}|">SE - Kỹ thuật phần mềm</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('major')}"
                                     th:errors="*{major}">Vui lòng chọn ngành</div>
                            </div>

                            <!-- Trạng thái học tập -->
                            <div class="col-12 mt-3">
                                <!-- 15.7: Switch checkbox trạng thái -->
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                                    <label class="form-check-label fw-semibold" th:for="${#ids.prev('active')}">Đang theo học tại trường</label>
                                </div>
                            </div>
                        </div>

                        <!-- 15.8: Nút Submit và Nút Hủy -->
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="*{id == null} ? 'Thêm mới sinh viên' : 'Lưu thay đổi'">Lưu</button>
                            <a th:href="@{/students}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
